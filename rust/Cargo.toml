[package]
name = "warp-agent"
version = "2.0.0"
edition = "2024"
description = "WarpAgent — a tile-grid chat client for opencode serve, rebuilt on GPUI"

[[bin]]
name = "warp-agent"
path = "src/main.rs"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["wayland", "x11"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "net", "io-util", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-channel = "2"
futures-util = "0.3"
smallvec = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
anyhow = "1"
rand = "0.9"
chrono = "0.4"
rust-embed = "8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
